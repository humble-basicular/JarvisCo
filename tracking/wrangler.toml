name = "jarvisweb-proof-tracking"
main = "src/index.ts"
tsconfig = "tsconfig.json"
send_metrics = false
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Both hosts are proxied by Cloudflare. The static site remains on Vercel.
routes = [
  { pattern = "jarvisweb.lt/p/*", zone_name = "jarvisweb.lt" },
  { pattern = "www.jarvisweb.lt/p/*", zone_name = "jarvisweb.lt" },
  { pattern = "jarvisweb.lt/t/*", zone_name = "jarvisweb.lt" },
  { pattern = "www.jarvisweb.lt/t/*", zone_name = "jarvisweb.lt" }
]

[[d1_databases]]
binding = "DB"
database_name = "jarvisweb-proof-events"
# Safe placeholder; provision a free D1 database and replace before deployment.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# EVENTS_TOKEN is set with `wrangler secret put EVENTS_TOKEN`, never here.
# No cron: retention cleanup runs on requests. No request logs/UA/IP capture.
[observability]
enabled = false
